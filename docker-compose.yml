services:
  mysql:
    image: mysql:8.4
    container_name: pos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: posroot
      MYSQL_DATABASE: pos_system
    ports:
      - "3306:3306"
    volumes:
      - pos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pposroot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pos_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: posroot
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pos_mysql_data:
